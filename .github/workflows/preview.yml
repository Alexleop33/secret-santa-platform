# Optional: a preview site for each pull request into `dev`, at
# https://pr-<number>.<project>.pages.dev. Frontend only — it uses the dev
# database as it is, with no migration push, so a PR that adds a migration
# may not work on its preview until it merges. That's a known limit of a
# preview, not a bug.
#
# Previews resolve to the dev Supabase project automatically: public/config.js
# sends every hostname that isn't the exact prod hostname to dev.
#
# Skipped for pull requests from forks: they don't get this repo's secrets,
# so the upload would fail anyway.
name: PR preview

on:
  pull_request:
    branches: [dev]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: development
    steps:
      - uses: actions/checkout@v4

      - name: Upload public/ to Cloudflare Pages (pr-N branch)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler@4.151.0 pages deploy public
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT }}"
          --branch "pr-${{ github.event.number }}"
          --commit-hash "${{ github.event.pull_request.head.sha }}"
