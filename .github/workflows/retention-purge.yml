# The retention purge: delete every family contact row for the closed
# drive, 60 days after it closes (CLAUDE.md: Feb 12, 2027 for the 2026
# drive). Run by hand from the Actions tab, gated by the `production`
# environment's required reviewers, so nobody runs SQL against prod by
# hand and the run is on the record.
#
# The database function refuses to run while the drive is still open, so
# the order is: close the drive in Drive settings, then run this.
name: Retention purge

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "purge" to confirm. Deletes the family contact rows of the closed drive. Cannot be undone.'
        required: true
      target:
        description: "Which project: production (default) or development"
        required: false
        default: production

concurrency:
  group: retention-purge
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.target }}
    steps:
      - name: Check the confirmation word
        run: |
          if [ "${{ inputs.confirm }}" != "purge" ]; then
            echo "::error::Type the word purge in the confirm box to run this."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      # The function logs what it deleted and refuses an open drive.
      - name: Purge the closed drive's contact rows
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >
          npx supabase db query --linked
          "select purge_retained_contacts('00000000-0000-4000-a000-000000002026') as contact_rows_deleted"
